; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:beeyond-frappe-web]
command=/home/beeyond/frappe-bench/beeyond/env/bin/gunicorn -b 127.0.0.1:8000 -w 5 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe.app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/web.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=beeyond
directory=/home/beeyond/frappe-bench/beeyond/sites
startretries=10

[program:beeyond-frappe-schedule]
command=/home/beeyond/.local/bin/bench schedule
priority=3
autostart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/schedule.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/schedule.error.log
user=beeyond
directory=/home/beeyond/frappe-bench/beeyond
startretries=10



[program:beeyond-frappe-short-worker]
command=/home/beeyond/.local/bin/bench worker --queue short,default
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/worker.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/worker.error.log
user=beeyond
stopwaitsecs=360
directory=/home/beeyond/frappe-bench/beeyond
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10

[program:beeyond-frappe-long-worker]
command=/home/beeyond/.local/bin/bench worker --queue long,default,short
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/worker.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/worker.error.log
user=beeyond
stopwaitsecs=1560
directory=/home/beeyond/frappe-bench/beeyond
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10





[program:beeyond-redis-cache]
command=/usr/bin/redis-server /home/beeyond/frappe-bench/beeyond/config/redis_cache.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/redis-cache.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/redis-cache.error.log
user=beeyond
directory=/home/beeyond/frappe-bench/beeyond/sites
startretries=10

[program:beeyond-redis-queue]
command=/usr/bin/redis-server /home/beeyond/frappe-bench/beeyond/config/redis_queue.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/redis-queue.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/redis-queue.error.log
user=beeyond
directory=/home/beeyond/frappe-bench/beeyond/sites
startretries=10



[program:beeyond-node-socketio]
command=/home/beeyond/.local/bin/bench socketio
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/beeyond/frappe-bench/beeyond/logs/node-socketio.log
stderr_logfile=/home/beeyond/frappe-bench/beeyond/logs/node-socketio.error.log
user=beeyond
directory=/home/beeyond/frappe-bench/beeyond
startretries=10


[group:beeyond-web]
programs=beeyond-frappe-web,beeyond-node-socketio




[group:beeyond-workers]
programs=beeyond-frappe-schedule,beeyond-frappe-short-worker,beeyond-frappe-long-worker




[group:beeyond-redis]
programs=beeyond-redis-cache,beeyond-redis-queue
